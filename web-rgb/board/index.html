<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 RGB</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaf0; --dim:#8b91a0; --accent:#ff8c28; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text);
         display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:20px; margin:0; letter-spacing:.3px; }
  #status { font-size:12px; color:var(--dim); }
  #status.err { color:#ff6b6b; }
  .orb-wrap { display:flex; justify-content:center; padding:8px 0 4px; }
  .orb { width:150px; height:150px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 60px 10px var(--glow,#ff8c2866); transition:background .15s, box-shadow .15s; position:relative; }
  .orb input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; border:0; }
  .hint { text-align:center; font-size:12px; color:var(--dim); margin-top:-6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; align-items:center; gap:12px; }
  .row label { width:84px; color:var(--dim); font-size:13px; }
  .row output { width:38px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  input[type=range] { flex:1; accent-color:var(--accent); height:28px; }
  .seg { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .seg button, .chips button { border:1px solid var(--line); background:#1f232c; color:var(--text); border-radius:10px;
         padding:10px 0; font:inherit; font-size:14px; cursor:pointer; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
  .chips { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .chips button { height:34px; padding:0; border-radius:50%; aspect-ratio:1; width:100%; height:auto; }
  footer { text-align:center; font-size:11px; color:var(--dim); }
</style>
</head>
<body>
<main>
  <header><h1>S3 RGB</h1><span id="status">connecting…</span></header>

  <div class="orb-wrap"><div class="orb" id="orb"><input type="color" id="color" aria-label="Pick colour"></div></div>
  <div class="hint">tap the light to pick a colour</div>

  <div class="card">
    <div class="chips" id="chips"></div>
  </div>

  <div class="card">
    <div class="seg" id="modes">
      <button data-m="solid">Solid</button><button data-m="breathe">Breathe</button>
      <button data-m="rainbow">Rainbow</button><button data-m="off">Off</button>
    </div>
    <div class="row"><label for="bri">Brightness</label><input type="range" id="bri" min="1" max="100"><output id="briv"></output></div>
    <div class="row"><label for="speed">Speed</label><input type="range" id="speed" min="0" max="100"><output id="speedv"></output></div>
  </div>

  <footer>ESP32-S3 · WS2812 on GPIO48 · MicroPython</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const PRESETS = ["#ff8c28","#ffd9a8","#ff2020","#20ff40","#2060ff","#b030ff","#20e0ff"];
let st = {}, pending = null, busy = false;

const hex = s => "#" + [s.r, s.g, s.b].map(v => v.toString(16).padStart(2, "0")).join("");
const rgb = h => ({ r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16) });

function paint() {
  const c = st.mode === "rainbow" ? "conic-gradient(red,yellow,lime,cyan,blue,magenta,red)" : st.mode === "off" ? "#2a2d35" : hex(st);
  $("orb").style.background = c;
  $("orb").style.setProperty("--glow", st.mode === "off" ? "transparent" : (st.mode === "rainbow" ? "#8080ff55" : hex(st) + "66"));
  $("color").value = hex(st);
  document.documentElement.style.setProperty("--accent", st.mode === "rainbow" || st.mode === "off" ? "#ff8c28" : hex(st));
  $("bri").value = st.bri; $("briv").textContent = st.bri + "%";
  $("speed").value = st.speed; $("speedv").textContent = st.speed;
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.m === st.mode));
}

async function push() {               // one request in flight; the latest change wins
  if (busy) return;
  busy = true;
  while (pending) {
    const body = pending; pending = null;
    try {
      const r = await fetch("/api/set", { method: "POST", body: JSON.stringify(body) });
      if (!pending) { st = await r.json(); paint(); }
      $("status").textContent = "online"; $("status").className = "";
    } catch (e) { $("status").textContent = "offline"; $("status").className = "err"; }
  }
  busy = false;
}
function set(p) { Object.assign(st, p); paint(); pending = Object.assign(pending || {}, p); push(); }

$("color").addEventListener("input", e => set(Object.assign(rgb(e.target.value), st.mode === "solid" || st.mode === "breathe" ? {} : { mode: "solid" })));
$("bri").addEventListener("input", e => set({ bri: +e.target.value }));
$("speed").addEventListener("input", e => set({ speed: +e.target.value }));
$("modes").addEventListener("click", e => e.target.dataset.m && set({ mode: e.target.dataset.m }));
PRESETS.forEach(h => {
  const b = document.createElement("button"); b.style.background = h; b.title = h;
  b.onclick = () => set(Object.assign(rgb(h), st.mode === "breathe" ? {} : { mode: "solid" }));
  $("chips").appendChild(b);
});

fetch("/api/state").then(r => r.json()).then(s => { st = s; paint(); $("status").textContent = "online"; })
  .catch(() => { $("status").textContent = "offline"; $("status").className = "err"; });
</script>
</body>
</html>
